# CI Event Map (ПР7): зависимости → линтер → тесты (ПР5–ПР7) → сборка образов → запуск в контейнерах.
# Проект лежит во вложенной папке event-map-app/, поэтому у всех шагов задан working-directory.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: event-map-app

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .

  test:
    name: Tests + coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: event-map-app/**/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -r users-service/requirements.txt \
                      -r events-service/requirements.txt \
                      -r attendance-service/requirements.txt \
                      -r requirements-dev.txt
      # Любой упавший тест → ненулевой код выхода → job красный, сборка образов не запускается.
      - name: Run tests (users / events / attendance)
        run: python scripts/run_tests.py
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: event-map-app/.coverage-data/
          include-hidden-files: true
          if-no-files-found: ignore

  docker:
    name: Docker build + compose smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for CI (random secrets, not stored in repo)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_USER=.*/POSTGRES_USER=eventmap/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: Build images
        run: docker compose build
      - name: Start system (migrations applied on start)
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test inside containers
        run: bash scripts/smoke_test.sh --db-down
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v
