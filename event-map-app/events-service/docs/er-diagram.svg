<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" font-family="Arial, sans-serif">
  <defs>
    <marker id="crow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L9,6 L0,12 L2,6 Z" fill="#2b4c7e"/>
    </marker>
  </defs>

  <!-- categories -->
  <g>
    <rect x="30" y="70" width="340" height="232" fill="#ffffff" stroke="#2b4c7e" stroke-width="2"/>
    <rect x="30" y="70" width="340" height="30" fill="#2b4c7e"/>
    <text x="200" y="90" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">categories</text>
    <line x1="30" y1="100" x2="370" y2="100" stroke="#2b4c7e"/>
    <text x="42" y="124" font-size="13">id          [PK] UUID</text>
    <line x1="30" y1="132" x2="370" y2="132" stroke="#c8d2e0"/>
    <text x="42" y="156" font-size="13" font-weight="bold">name        NOT NULL, UNIQUE</text>
    <line x1="30" y1="164" x2="370" y2="164" stroke="#c8d2e0"/>
    <text x="42" y="188" font-size="13">slug        UNIQUE (мигр. 0002)</text>
    <line x1="30" y1="196" x2="370" y2="196" stroke="#c8d2e0"/>
    <text x="42" y="220" font-size="13">created_at  NOT NULL</text>
    <line x1="30" y1="228" x2="370" y2="228" stroke="#c8d2e0"/>
    <text x="42" y="250" font-size="12" fill="#555">связь 1:N с events</text>
  </g>

  <!-- events -->
  <g>
    <rect x="500" y="40" width="350" height="342" fill="#ffffff" stroke="#2b4c7e" stroke-width="2"/>
    <rect x="500" y="40" width="350" height="30" fill="#2b4c7e"/>
    <text x="675" y="60" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">events</text>
    <line x1="500" y1="70" x2="850" y2="70" stroke="#2b4c7e"/>

    <text x="512" y="94" font-size="13">id          [PK] UUID</text>
    <line x1="500" y1="102" x2="850" y2="102" stroke="#c8d2e0"/>
    <text x="512" y="126" font-size="13" font-weight="bold">title        NOT NULL, CHECK 2..100</text>
    <line x1="500" y1="134" x2="850" y2="134" stroke="#c8d2e0"/>
    <text x="512" y="158" font-size="13">description  NOT NULL, CHECK &lt;=2000</text>
    <line x1="500" y1="166" x2="850" y2="166" stroke="#c8d2e0"/>
    <text x="512" y="190" font-size="13">lat          NOT NULL, CHECK -90..90</text>
    <line x1="500" y1="198" x2="850" y2="198" stroke="#c8d2e0"/>
    <text x="512" y="222" font-size="13">lng          NOT NULL, CHECK -180..180</text>
    <line x1="500" y1="230" x2="850" y2="230" stroke="#c8d2e0"/>
    <text x="512" y="254" font-size="13">starts_at    NOT NULL</text>
    <line x1="500" y1="262" x2="850" y2="262" stroke="#c8d2e0"/>
    <text x="512" y="286" font-size="13" fill="#7a1f1f" font-weight="bold">category_id  [FK] -&gt; categories.id</text>
    <line x1="500" y1="294" x2="850" y2="294" stroke="#c8d2e0"/>
    <text x="512" y="318" font-size="13">organizer_id NOT NULL</text>
    <line x1="500" y1="326" x2="850" y2="326" stroke="#c8d2e0"/>
    <text x="512" y="350" font-size="13">created_at / updated_at  NOT NULL</text>
    <line x1="500" y1="358" x2="850" y2="358" stroke="#c8d2e0"/>
    <text x="512" y="376" font-size="12" fill="#555">связь N:M с users через event_participants</text>
  </g>

  <!-- users -->
  <g>
    <rect x="30" y="370" width="340" height="252" fill="#ffffff" stroke="#2b4c7e" stroke-width="2"/>
    <rect x="30" y="370" width="340" height="30" fill="#2b4c7e"/>
    <text x="200" y="390" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">users (мигр. 0003)</text>
    <line x1="30" y1="400" x2="370" y2="400" stroke="#2b4c7e"/>
    <text x="42" y="424" font-size="13">id         [PK] UUID</text>
    <line x1="30" y1="432" x2="370" y2="432" stroke="#c8d2e0"/>
    <text x="42" y="456" font-size="13">name       NOT NULL</text>
    <line x1="30" y1="464" x2="370" y2="464" stroke="#c8d2e0"/>
    <text x="42" y="488" font-size="13">email      NOT NULL, UNIQUE</text>
    <line x1="30" y1="496" x2="370" y2="496" stroke="#c8d2e0"/>
    <text x="42" y="520" font-size="13">role       NOT NULL, CHECK admin/organizer/user</text>
    <line x1="30" y1="528" x2="370" y2="528" stroke="#c8d2e0"/>
    <text x="42" y="552" font-size="13">created_at NOT NULL</text>
    <line x1="30" y1="560" x2="370" y2="560" stroke="#c8d2e0"/>
    <text x="42" y="582" font-size="12" fill="#555">связь N:M с events через event_participants</text>
    <text x="42" y="600" font-size="12" fill="#555">удаление пользователя -> CASCADE</text>
  </g>

  <!-- event_participants -->
  <g>
    <rect x="500" y="430" width="350" height="222" fill="#ffffff" stroke="#2b4c7e" stroke-width="2"/>
    <rect x="500" y="430" width="350" height="30" fill="#2b4c7e"/>
    <text x="675" y="450" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">event_participants (мигр. 0003)</text>
    <line x1="500" y1="460" x2="850" y2="460" stroke="#2b4c7e"/>
    <text x="512" y="484" font-size="13" fill="#7a1f1f" font-weight="bold">event_id [PK, FK] -&gt; events.id</text>
    <line x1="500" y1="492" x2="850" y2="492" stroke="#c8d2e0"/>
    <text x="512" y="516" font-size="13" fill="#7a1f1f" font-weight="bold">user_id  [PK, FK] -&gt; users.id</text>
    <line x1="500" y1="524" x2="850" y2="524" stroke="#c8d2e0"/>
    <text x="512" y="548" font-size="13">registered_at NOT NULL</text>
    <line x1="500" y1="556" x2="850" y2="556" stroke="#c8d2e0"/>
    <text x="512" y="580" font-size="13">status   NOT NULL, CHECK (registered/attended/cancelled)</text>
    <line x1="500" y1="588" x2="850" y2="588" stroke="#c8d2e0"/>
    <text x="512" y="612" font-size="12" fill="#555">составной PK (event_id, user_id), FK CASCADE</text>
    <text x="512" y="630" font-size="12" fill="#555">индекс ix_event_participants_user_id</text>
  </g>

  <!-- relationship categories 1 --- N events -->
  <line x1="370" y1="150" x2="496" y2="150" stroke="#2b4c7e" stroke-width="3" marker-end="url(#crow)"/>
  <text x="390" y="140" font-size="14" font-weight="bold" fill="#2b4c7e">1</text>
  <text x="452" y="140" font-size="14" font-weight="bold" fill="#2b4c7e">N</text>
  <text x="396" y="172" font-size="12" fill="#2b4c7e">FK category_id</text>

  <!-- relationship users 1 --- N event_participants -->
  <line x1="374" y1="500" x2="496" y2="500" stroke="#2b4c7e" stroke-width="3" marker-end="url(#crow)"/>
  <text x="388" y="490" font-size="14" font-weight="bold" fill="#2b4c7e">1</text>
  <text x="456" y="490" font-size="14" font-weight="bold" fill="#2b4c7e">N</text>
  <text x="400" y="522" font-size="12" fill="#2b4c7e">FK user_id</text>

  <!-- relationship events 1 --- N event_participants -->
  <line x1="675" y1="386" x2="675" y2="426" stroke="#2b4c7e" stroke-width="3" marker-end="url(#crow)"/>
  <text x="684" y="402" font-size="14" font-weight="bold" fill="#2b4c7e">1</text>
  <text x="684" y="424" font-size="14" font-weight="bold" fill="#2b4c7e">N</text>
  <text x="690" y="410" font-size="11" fill="#2b4c7e">FK event_id</text>
</svg>