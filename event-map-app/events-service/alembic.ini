# Конфигурация Alembic (ПР3).
# URL базы подставляется из DATABASE_URL в alembic/env.py.
[alembic]
script_location = alembic
prepend_sys_path = .
# путь к БД по умолчанию (переопределяется из переменной окружения)
sqlalchemy.url = sqlite:///./events.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S