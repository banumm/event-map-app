<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#ffffff"/>

  <!-- Client -->
  <rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2C2C2A">Клиент (браузер)</text>

  <!-- Public zone -->
  <rect x="40" y="100" width="600" height="140" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="56" y="118" font-family="sans-serif" font-size="12" fill="#5F5E5A">Публичная зона</text>

  <!-- Events Service -->
  <rect x="70" y="140" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="160" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#04342C">Events Service</text>
  <text x="160" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Flask · мероприятия</text>

  <!-- Attendance Service -->
  <rect x="430" y="140" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="520" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4A1B0C">Attendance Service</text>
  <text x="520" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Flask · участие</text>

  <!-- Internal zone -->
  <rect x="200" y="300" width="280" height="120" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="216" y="318" font-family="sans-serif" font-size="12" fill="#5F5E5A">Внутренняя зона</text>

  <!-- Users Service -->
  <rect x="250" y="340" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="364" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#26215C">Users Service</text>
  <text x="340" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Django · auth, роли</text>

  <!-- Arrows -->
  <path d="M270 55 L160 55 L160 138" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M410 55 L520 55 L520 138" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M180 196 L250 360" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M500 196 L430 360" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M430 168 L250 168" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="340" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">проверка события / пользователя</text>
</svg>
